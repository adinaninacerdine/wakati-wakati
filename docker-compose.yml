# ============================================================
# GED WAKATI — déploiement VPS (vps121585, /opt/ged-wakati)
# ============================================================
# Démarrage :   docker compose up -d --build
# Journaux  :   docker compose logs -f ged
# Mise à jour : git pull && docker compose up -d --build
#
# Le réseau wakati_network est partagé avec Odoo : ce Caddy sert à la
# fois ged.wakati.km et erp.wakati.km (voir Caddyfile).
#
# Les données de travail sont des fichiers du dossier /opt/ged-wakati
# montés dans le conteneur : elles survivent à une reconstruction d'image.
# Avant le premier démarrage avec le module Courrier :
#   mkdir -p courrier && chown 1000:1000 courrier

services:

  ged:
    build: .
    container_name: ged-wakati
    restart: unless-stopped

    # Aucun port publié : Caddy est le seul point d'entrée.
    # L'application n'est jamais joignable directement depuis Internet.
    expose:
      - "5000"

    volumes:
      # Secrets — montés en lecture seule, jamais dans l'image.
      - ./zoho_config.py:/app/zoho_config.py:ro
      - ./notifier_config.py:/app/notifier_config.py:ro
      - ./auth_config.py:/app/auth_config.py:ro
      - ./folders_map.json:/app/folders_map.json:ro

      # Données de travail — fichiers de l'hôte.
      - ./registre_2026.csv:/app/registre_2026.csv
      - ./en_attente.json:/app/en_attente.json
      - ./a_classer:/app/a_classer
      - ./visas.json:/app/visas.json
      - ./a_viser:/app/a_viser

      # Module Courrier : annuaire, modèles, projets, échéances, clé IA.
      - ./courrier:/app/courrier

    environment:
      TZ: Indian/Comoro
      GED_CONTENEUR: "1"
      GED_AUTH: "1"

    networks:
      - wakati_network

  caddy:
    image: caddy:2-alpine
    container_name: caddy-wakati
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-donnees:/data
      - caddy-config:/config
    networks:
      - wakati_network

volumes:
  caddy-donnees:
  caddy-config:

networks:
  wakati_network:
    external: true
